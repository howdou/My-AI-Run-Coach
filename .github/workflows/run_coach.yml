name: Daily AI Run Coach

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 1 * * *'

jobs:
  sync_garmin_to_sheets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        # 🌟 移除 garth，並強制升級 garminconnect 確保拿到 3.0+ 版本
        run: pip install "garminconnect>=3.0.0" gspread google-auth requests[socks]

      # 🛡️ 隱身斗篷：安裝 Cloudflare WARP 並啟動 Socks5 Proxy 模式
      - name: Setup Cloudflare WARP Proxy
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          
          # 初始化並設定為 Proxy 模式
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          
          echo "等待 WARP 連線..."
          sleep 5
          echo "WARP Proxy 啟動完成！"

      # 🌟 新增步驟：準備 ~/.garminconnect 資料夾讓新版套件讀寫 token
      - name: Set up Garmin Tokens
        run: |
          mkdir -p ~/.garminconnect
          # 如果你有在 GitHub Secrets 設定 GARMIN_TOKENS_JSON，則寫入檔案
          if [ -n "${{ secrets.GARMIN_TOKENS_JSON }}" ]; then
            echo "${{ secrets.GARMIN_TOKENS_JSON }}" > ~/.garminconnect/garmin_tokens.json
          fi

      - name: Run Data Sync Script
        env:
          # 替換為你的帳號與密碼 (需前往 GitHub Secrets 新增)
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          # 🛡️ 強制 Python 透過 WARP 的 Socks5 通道連線 Garmin
          https_proxy: socks5://127.0.0.1:40000
          http_proxy: socks5://127.0.0.1:40000
        run: |
          # 加上你朋友的 3 次重試機制，增加網路不穩時的容錯率
          for i in 1 2 3; do
            echo "▶️ 開始第 $i 次嘗試同步資料..."
            python coach.py && exit 0
            echo "⚠️ 第 $i 次執行失敗！等待 60 秒後自動重試..."
            sleep 60
          done
          echo "❌ 已經嘗試 3 次皆失敗，請檢查 API 狀態。"
          exit 1
